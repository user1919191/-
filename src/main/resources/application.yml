      max-results: 5
      min-score: 0.6
      main-flow-enabled: true
      main-flow-top-k: 3
      main-flow-min-answer-length: 20
      ingest-on-startup: false
      parent-max-segment-size: 1800
      parent-max-overlap-size: 120
      child-max-segment-size: 500
      child-max-overlap-size: 80
      splitter-max-segment-size: 800
      splitter-max-overlap-size: 120


