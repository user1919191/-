# 鍏叡閰嶇疆鏂囦欢
spring:
  application:
    name: springboot-init-master
  # 榛樿 dev 鐜
  profiles:
    active: dev
  # 鏀寔 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 鏁版嵁搴撻厤缃?
  datasource:
    #鍚戦噺鏁版嵁搴?
    pgvector:
      url: #Todo 濉叆鑷繁鐨勯厤缃?
      username:
      password:
      driver-class-name: org.postgresql.Driver
    #MySQL鏁版嵁搴?
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mianshiya?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    # 鎸囧畾鏁版嵁婧愮被鍨?
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 閰嶇疆鍒濆鍖栧ぇ灏忋€佹渶灏忋€佹渶澶?
      initial-size: 20
      minIdle: 20
      max-active: 200
      # 閰嶇疆鑾峰彇杩炴帴绛夊緟瓒呮椂鐨勬椂闂?鍗曚綅锛氭绉?
      max-wait: 2000
      # 閰嶇疆闂撮殧澶氫箙鎵嶈繘琛屼竴娆℃娴嬶紝妫€娴嬮渶瑕佸叧闂殑绌洪棽杩炴帴锛屽崟浣嶆槸姣
      time-between-eviction-runs-millis: 2000
      # 閰嶇疆涓€涓繛鎺ュ湪姹犱腑鏈€灏忕敓瀛樼殑鏃堕棿锛屽崟浣嶆槸姣
      min-evictable-idle-time-millis: 600000
      max-evictable-idle-time-millis: 900000
      # 鐢ㄦ潵娴嬭瘯杩炴帴鏄惁鍙敤鐨凷QL璇彞,榛樿鍊兼瘡绉嶆暟鎹簱閮戒笉鐩稿悓,杩欐槸mysql
      validationQuery: select 1
      # 搴旂敤鍚戣繛鎺ユ睜鐢宠杩炴帴锛屽苟涓攖estOnBorrow涓篺alse鏃讹紝杩炴帴姹犲皢浼氬垽鏂繛鎺ユ槸鍚﹀浜庣┖闂茬姸鎬侊紝濡傛灉鏄紝鍒欓獙璇佽繖鏉¤繛鎺ユ槸鍚﹀彲鐢?
      testWhileIdle: true
      # 濡傛灉涓簍rue锛岄粯璁ゆ槸false锛屽簲鐢ㄥ悜杩炴帴姹犵敵璇疯繛鎺ユ椂锛岃繛鎺ユ睜浼氬垽鏂繖鏉¤繛鎺ユ槸鍚︽槸鍙敤鐨?
      testOnBorrow: false
      # 濡傛灉涓簍rue锛堥粯璁alse锛夛紝褰撳簲鐢ㄤ娇鐢ㄥ畬杩炴帴锛岃繛鎺ユ睜鍥炴敹杩炴帴鐨勬椂鍊欎細鍒ゆ柇璇ヨ繛鎺ユ槸鍚﹁繕鍙敤
      testOnReturn: false
      # 鏄惁缂撳瓨preparedStatement锛屼篃灏辨槸PSCache銆侾SCache瀵规敮鎸佹父鏍囩殑鏁版嵁搴撴€ц兘鎻愬崌宸ㄥぇ锛屾瘮濡傝oracle
      poolPreparedStatements: true
      # 瑕佸惎鐢≒SCache锛屽繀椤婚厤缃ぇ浜?锛屽綋澶т簬0鏃讹紝 poolPreparedStatements鑷姩瑙﹀彂淇敼涓簍rue锛?
      # 鍦―ruid涓紝涓嶄細瀛樺湪Oracle涓婸SCache鍗犵敤鍐呭瓨杩囧鐨勯棶棰橈紝
      # 鍙互鎶婅繖涓暟鍊奸厤缃ぇ涓€浜涳紝姣斿璇?00
      maxOpenPreparedStatements: 20
      # 杩炴帴姹犱腑鐨刴inIdle鏁伴噺浠ュ唴鐨勮繛鎺ワ紝绌洪棽鏃堕棿瓒呰繃minEvictableIdleTimeMillis锛屽垯浼氭墽琛宬eepAlive鎿嶄綔
      keepAlive: true
      # Spring 鐩戞帶锛屽埄鐢╝op 瀵规寚瀹氭帴鍙ｇ殑鎵ц鏃堕棿锛宩dbc鏁拌繘琛岃褰?
      aop-patterns: "com.springboot.template.dao.*"
      ########### 鍚敤鍐呯疆杩囨护鍣紙绗竴涓?stat 蹇呴』锛屽惁鍒欑洃鎺т笉鍒癝QL锛?#########
      filters: stat,wall,log4j2
      # 鑷繁閰嶇疆鐩戞帶缁熻鎷︽埅鐨刦ilter
      filter:
        # 寮€鍚痙ruiddatasource鐨勭姸鎬佺洃鎺?
        stat:
          enabled: true
          db-type: mysql
          # 寮€鍚參sql鐩戞帶锛岃秴杩?s 灏辫涓烘槸鎱ql锛岃褰曞埌鏃ュ織涓?
          log-slow-sql: true
          slow-sql-millis: 2000
        # 鏃ュ織鐩戞帶锛屼娇鐢╯lf4j 杩涜鏃ュ織杈撳嚭
        slf4j:
          enabled: true
          statement-log-error-enabled: true
          statement-create-after-log-enabled: false
          statement-close-after-log-enabled: false
          result-set-open-after-log-enabled: false
          result-set-close-after-log-enabled: false
      ########## 閰嶇疆WebStatFilter锛岀敤浜庨噰闆唚eb鍏宠仈鐩戞帶鐨勬暟鎹?##########
      web-stat-filter:
        enabled: true                   # 鍚姩 StatFilter
        url-pattern: /* # 杩囨护鎵€鏈塽rl
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" # 鎺掗櫎涓€浜涗笉蹇呰鐨剈rl
        session-stat-enable: true       # 寮€鍚痵ession缁熻鍔熻兘
        session-stat-max-count: 1000 # session鐨勬渶澶т釜鏁?榛樿100
      ########## 閰嶇疆StatViewServlet锛堢洃鎺ч〉闈級锛岀敤浜庡睍绀篋ruid鐨勭粺璁′俊鎭?##########
      stat-view-servlet:
        enabled: true                   # 鍚敤StatViewServlet
        url-pattern: /druid/* # 璁块棶鍐呯疆鐩戞帶椤甸潰鐨勮矾寰勶紝鍐呯疆鐩戞帶椤甸潰鐨勯椤垫槸/druid/index.html
        reset-enable: false              # 涓嶅厑璁告竻绌虹粺璁℃暟鎹?閲嶆柊璁＄畻
        login-username: root # 閰嶇疆鐩戞帶椤甸潰璁块棶瀵嗙爜
        login-password: 123
        allow: 127.0.0.1 # 鍏佽璁块棶鐨勫湴鍧€锛屽鏋渁llow娌℃湁閰嶇疆鎴栬€呬负绌猴紝鍒欏厑璁告墍鏈夎闂?
        deny: # 鎷掔粷璁块棶鐨勫湴鍧€锛宒eny浼樺厛浜巃llow锛屽鏋滃湪deny鍒楄〃涓紝灏辩畻鍦╝llow鍒楄〃涓紝涔熶細琚嫆缁?
  ai:
    dashscope:
      api-key:
        key1: #todo 濉叆鑷繁鐨勯厤缃?
        key2:
      chat:
        options:
          model:
            model1: "qwen-plus"
            model2: "qwen-vl-ocr"
  # Redis 閰嶇疆
  redis:
    database: 1
    host: localhost
    port: 6379
    timeout: 5000
  #    password: 123456  # 鏂囦欢涓婁紶
  servlet:
    multipart:
      # 澶у皬闄愬埗
      max-file-size: 10MB
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: file:./docs/mianshiya_mysql_init.sql
      continue-on-error: true
  session:
    store-type: none
server:
