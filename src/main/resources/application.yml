app:
  redisson:
    enabled: false
  hotkey:
    enabled: false
  pgvector:
    enabled: false
  interview:
    ai:
      text:
        evaluation-model: "qwen-plus"
        planning-model: "qwen-plus"
        json-repair-model: "qwen-turbo"
      multimodal:
        ocr-model: "qwen-vl-ocr"
